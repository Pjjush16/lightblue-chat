name: Build All Platforms

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Linux desktop build (native, no cross-compile needed)
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build Linux
        run: cd src-tauri && cargo tauri build --bundles deb

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: lightblue-chat-linux
          path: src-tauri/target/release/bundle/deb/*.deb

  # Android APK build (Tauri + NDK cross-compile on CI)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Set up Android SDK + NDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Build Tauri Android APK
        run: cd src-tauri && cargo tauri android build --apk --target aarch64
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lightblue-chat-android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk

  # Windows build (cross-compile not needed — use native runner)
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows
        run: cd src-tauri && cargo tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: lightblue-chat-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  # macOS build
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install frontend dependencies
        run: npm install

      - name: Build macOS
        run: cd src-tauri && cargo tauri build --target universal-apple-darwin

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: lightblue-chat-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
